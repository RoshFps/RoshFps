<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Roshan Immanuel — M.Sc. Cybersecurity, Saarland University">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="296" width="1200" height="4" fill="url(#accent)"/>

  <!-- window dots -->
  <circle cx="44" cy="40" r="7" fill="#f87171"/>
  <circle cx="68" cy="40" r="7" fill="#fbbf24"/>
  <circle cx="92" cy="40" r="7" fill="#34d399"/>
  <text x="124" y="45" class="mono" font-size="15" fill="#64748b">roshan@saarbruecken: ~</text>

  <text x="60" y="108" class="mono" font-size="20" fill="#34d399">$ <tspan fill="#cbd5e1">whoami</tspan></text>
  <text x="60" y="168" class="sans" font-size="54" font-weight="700" fill="#f8fafc">Roshan Immanuel</text>
  <text x="60" y="210" class="sans" font-size="22" fill="#94a3b8">M.Sc. Cybersecurity student · Saarland University, Germany</text>
  <text x="60" y="256" class="mono" font-size="18" fill="#22d3ee">fuzzing · reverse engineering · applied cryptography · web security<tspan class="cursor" fill="#34d399"> ▍</tspan></text>

  <!-- shield mark -->
  <g transform="translate(980 70)" opacity="0.95">
    <path d="M80 0 L150 26 V86 C150 132 120 164 80 180 C40 164 10 132 10 86 V26 Z" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <rect x="56" y="82" width="48" height="40" rx="6" fill="none" stroke="#e2e8f0" stroke-width="4"/>
    <path d="M65 82 V68 a15 15 0 0 1 30 0 V82" fill="none" stroke="#e2e8f0" stroke-width="4"/>
    <circle cx="80" cy="100" r="5" fill="#34d399"/>
    <path d="M80 104 V112" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
