<text x="70" y="78" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#34d399">roshan@saarbruecken:~$ <tspan fill="#e5e7eb">./whoami</tspan></text>
<text x="66" y="150" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#name)">Roshan Immanuel</text>
