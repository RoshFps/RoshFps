<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Roshan Immanuel, M.Sc. Cybersecurity student at Saarland University">
<style>
.ph{animation:cyc 12s infinite;animation-fill-mode:backwards}
@keyframes cyc{0%{opacity:0;transform:translateY(6px)}3%{opacity:1;transform:none}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.scan{animation:scan 6s linear infinite}@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(320px)}}
.pulse{transform-origin:1010px 150px;animation:pulse 3.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.8;transform:scale(1.06)}}
.hx{animation:fl 5s ease-in-out infinite}@keyframes fl{0%,100%{opacity:.25}50%{opacity:.6}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1b33"/></linearGradient>
<radialGradient id="glow" cx="0.84" cy="0.5" r="0.45"><stop offset="0" stop-color="#34d399" stop-opacity="0.22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
<linearGradient id="sc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.12"/></linearGradient>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<clipPath id="r"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="300" fill="url(#bg)"/>
<rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>
<rect width="1200" height="300" fill="url(#glow)"/>
